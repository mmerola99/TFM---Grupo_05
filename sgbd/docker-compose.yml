services:
  postgres:
    image: postgres:16-alpine
    container_name: afilc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: afilc
      POSTGRES_USER: afilc_user
      POSTGRES_PASSWORD: afilc_pass
    ports:
      - "5432:5432"
    volumes:
      - afilc_pgdata:/var/lib/postgresql/data
      - ./sql/ddl/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed/002_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afilc_user -d afilc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  afilc_pgdata:
